scenario: L4-template-engine
weights: {COR: 30, ROB: 15, EFF: 14, AUT: 12, QUA: 13, REG: 8, FID: 8}   # sum 100 (REQUIREMENTS §7.1)
pass_threshold: 70
gate: "acceptance_pass >= 0.95"                          # GRADING.md §4 (L3–L4); REQUIREMENTS §6.2/§7.3
denominators:                                            # explicit; equal to the real test counts (no drift)
  acceptance: 47
  adversarial: 26
static_floor:
  python: [ruff, pyright]                                # QUA hard floor; plus the AC44 no-eval/exec source scan
regression:
  strategy: per-group-diff                               # GRADING.md §5 (L4)
judge:                                                   # AI-graded axes (GRADING.md §6); left null by the runner
  QUA: {agent: grader, rubric: "framework/GRADING.md#6 (QUA template)"}
  FID: {agent: grader, rubric: "framework/GRADING.md#6 (FID template)", inputs: [design/]}
# Check registry (GRADING.md §1). Each id maps 1:1 to a test function; weight 1 each,
