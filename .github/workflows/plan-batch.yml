# Plan Batch — issue → compiler-accepted plan.json → reviewable Mermaid on the issue.
#
# Flow: a maintainer adds the `plan-batch` label to an issue. This workflow
# delegates to attractor-pipelines' goal-plan/prepare composite action (a
# reusable action referenced here by pinned commit SHA), which runs the
# `plan-batch` PLANNER attractor with the issue as the goal, converges on a
# compiler-valid `plan.json`, deterministically compiles it to its parent
# `.dot`, renders it to Mermaid, and commits all three to a disposable
# `plan-batch/issue-<n>-<run>` branch. This workflow then posts the plan back
# to the issue for review. Approving it (`/execute-plan` or the
# `execute-plan` label) is handled by execute-plan.yml.
#
# SECURITY: triggers on `issues` (never `pull_request_target`). The pipeline only
# READS the issue and PLANS; nothing executes here. The plan is executed only after
# an explicit human approval in execute-plan.yml.
#
# Prerequisites: this workflow only fires from the DEFAULT branch, and needs the
# `ANTHROPIC_API_KEY` secret to be present on that branch. All engine assets
# (the plan compiler, the planner attractor, and the render/relocate logic)
# are supplied by the pinned attractor-pipelines goal-plan/prepare action from
# its own checkout — this repo does not vendor any of them.

name: Plan Batch

on:
  issues:
    types: [labeled]

permissions:
  contents: write # commit the disposable plan branch
  issues: write # post the review comment

concurrency:
  # One planning run at a time per issue; a newer label re-plan supersedes an older.
  group: plan-batch-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.label.name == 'plan-batch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Everything else (planner, compiler-validity gate, goal-file gate,
      # relocate/rewrite/compile/render, commit + push the plan branch) lives
      # in attractor-pipelines' goal-plan/prepare action, referenced here by
      # pinned commit SHA.
      - name: Prepare goal-plan
        id: plan
        uses: kenotron-ms/attractor-pipelines/.github/actions/goal-plan/prepare@83776af
        with:
          issue_number: ${{ github.event.issue.number }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}

      - name: Report planning failure to issue
        if: steps.plan.outputs.plan_produced == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let residual = '_No residual note was produced._';
            try { residual = fs.readFileSync('${{ steps.plan.outputs.residual_path }}', 'utf8'); } catch {}
            const body = [
              '### ⚠️ plan-batch could not produce a valid plan',
              '',
              'The planner attractor did not converge on a plan the compiler accepts,',
              'so no plan.json was produced. Details:',
              '',
              residual,
              '',
              '_Refine the issue and re-add the `plan-batch` label to try again._',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body });
            core.setFailed('planner produced no plan.json');

      # Post the plan for human review. Mermaid + plan.json are inlined;
      # the (large) compiled .dot is linked on the branch to stay under the
      # 65 536-char comment limit.
      - name: Post plan for review
        if: steps.plan.outputs.plan_produced == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = '${{ steps.plan.outputs.plan_branch }}';
            const parentDotPath = '${{ steps.plan.outputs.parent_dot_path }}';
            const mermaid = fs.readFileSync('${{ steps.plan.outputs.mermaid_path }}', 'utf8');
            const plan = fs.readFileSync('${{ steps.plan.outputs.plan_json_path }}', 'utf8');
            const runId = '${{ github.run_id }}';
            const dotUrl = `../blob/${branch}/${parentDotPath}`;
            const clip = (s, n) => (s.length > n ? s.slice(0, n) + '\n… (truncated — see branch)' : s);
            const body = [
              `### 📋 Proposed batch plan — \`${runId}\``,
              `Branch: \`${branch}\``,
              '',
              '```mermaid',
              clip(mermaid, 40000),
              '```',
              '',
              '<details><summary>plan.json</summary>',
              '',
              '```json',
              clip(plan, 15000),
              '```',
              '',
              '</details>',
              '',
              `Compiled pipeline: [\`${parentDotPath}\`](${dotUrl})`,
              '',
              '---',
              '✅ **To execute this plan:** comment `/execute-plan` **or** add the `execute-plan` label',
              '(requires write access; a maintainer must also approve the `batch-execute`',
              'environment).',
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body });
