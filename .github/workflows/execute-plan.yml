# Execute Plan — execute an approved batch plan on the runner.
#
# Trigger (BOTH accepted):
#   - a comment beginning `/execute-plan` on the issue, OR
#   - adding the `execute-plan` label to the issue.
# In either case the actor must have write access, AND the `batch-execute`
# GitHub Environment (configured with required reviewers) must be approved.
#
# It resolves the plan branch that plan-batch.yml posted, checks it out at that
# exact commit, then delegates provisioning, anti-tamper verification, and
# execution to attractor-pipelines' goal-plan/execute composite action (a
# reusable action referenced here by pinned commit SHA).
#
# SECURITY: a lane's `verifier_argv` is arbitrary argv that EXECUTES on the
# runner. Three gates guard that: (1) the actor must be a write collaborator,
# (2) the `batch-execute` environment forces a maintainer approval click, and
# (3) the anti-tamper recompile (inside goal-plan/execute) rejects any
# hand-edited branch. `issue_comment` runs in the base-branch context with
# write perms, so gate (1) is mandatory.

name: Execute Plan

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: execute-plan-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute:
    # Real issues only (not PR comments); /execute-plan comment OR execute-plan label.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       startsWith(github.event.comment.body, '/execute-plan')) ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'execute-plan')
    runs-on: ubuntu-latest
    environment: batch-execute # required-reviewer gate — human approval before any execution
    steps:
      # GATE 1 — the actor must have write/maintain/admin on the repo.
      - name: Authorize actor
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.eventName === 'issue_comment'
              ? context.payload.comment.user.login
              : context.payload.sender.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: actor });
            if (!['write', 'maintain', 'admin'].includes(data.permission)) {
              core.setFailed(`@${actor} lacks write access (has '${data.permission}'). Refusing to execute.`);
            } else {
              core.info(`Authorized @${actor} (${data.permission}).`);
            }

      # Resolve the plan branch from the most recent plan-batch review comment.
      - name: Resolve plan branch
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const matches = comments
              .map(c => (c.body || '').match(/Branch:\s*`([^`]+)`/))
              .filter(Boolean);
            if (matches.length === 0) core.setFailed('No plan branch found on this issue — run plan-batch first.');
            const branch = matches[matches.length - 1][1];
            const runId = branch.split('-').pop();
            core.setOutput('branch', branch);
            core.setOutput('run_id', runId);
            core.setOutput('outdir', `generated/plans/${runId}`);
            core.info(`Plan branch: ${branch}`);

      - name: Checkout plan branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      # Everything else (provisioning, anti-tamper recompile, running the
      # batch, and the run summary) lives in attractor-pipelines'
      # goal-plan/execute action, referenced here by pinned commit SHA.
      - name: Run goal-plan
        id: run
        uses: kenotron-ms/attractor-pipelines/.github/actions/goal-plan/execute@83776af2c24f384fda85bc03585f0f7a06b99365
        with:
          outdir: ${{ steps.resolve.outputs.outdir }}
          run_id: ${{ steps.resolve.outputs.run_id }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attractor-run-logs-${{ steps.resolve.outputs.run_id }}
          path: ${{ steps.run.outputs.logs_dir }}
          if-no-files-found: warn

      - name: Report result to issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.run.outcome }}';
            const runId = '${{ steps.resolve.outputs.run_id }}';
            const terminal = '${{ steps.run.outputs.terminal }}';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const emoji = status === 'success' ? '🚀' : '❌';
            let summary = '_(per-lane summary unavailable; see the run Step Summary or the `attractor-run-logs` artifact.)_';
            try {
              summary = fs.readFileSync('${{ steps.run.outputs.summary_path }}', 'utf8');
              const MAX = 60000; // keep well under GitHub's ~65k comment limit
              if (summary.length > MAX) {
                summary = summary.slice(0, MAX) + '\n\n_…truncated; see the run Step Summary or the `attractor-run-logs` artifact._';
              }
            } catch (e) {
              core.info(`No summary file to embed: ${e}`);
            }
            const body = [
              `${emoji} **Batch \`${runId}\` execution: ${status}** (terminal: \`${terminal || 'unknown'}\`).`,
              '',
              summary,
              '',
              `[View the full run](${url}) · the same per-lane summary is on the run's **Step Summary**; raw per-node logs are in the \`attractor-run-logs\` artifact.`,
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body });
